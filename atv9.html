<!DOCTYPE html>
<html>
<head>
    <!-- Define o título que aparecerá na aba do navegador -->
    <title>Formulário</title>
</head>

<body>

<!-- Título principal da página -->
<h1>Formulário</h1>

<!-- Início do formulário -->
<form>

<!-- Grupo de informações pessoais -->
<fieldset>
    <!-- Título do grupo -->
    <legend>Dados pessoais</legend>

    <!-- Campo para digitar o nome -->
    Nome:
    <input type="text" name="nome">
    <br><br>

    <!-- Campo para digitar o endereço -->
    Endereço:
    <input type="text" name="endereco">
    <br><br>

    <!-- Campo para digitar a cidade -->
    Cidade:
    <input type="text" name="cidade">
    <br><br>

    <!-- Lista para selecionar o estado -->
    Estado:
    <select name="estado">

        <!-- Opções disponíveis para o estado -->
        <option>São Paulo</option>
        <option>Rio de Janeiro</option>
        <option>Minas Gerais</option>
        <option>Bahia</option>
        <option>Alagoas</option>
        <option>Bahia</option>
        <option>Ceará</option>
        <option>Maranhão</option>
        <option>Paraíba</option>
        <option>Pernambuco</option>
        <option>Piauí</option>
        <option>Rio Grande do Norte</option>
        <option>Sergipe</option>

    </select>
</fieldset>

<br>

<!-- Grupo de informações profissionais -->
<fieldset>

    <!-- Título do grupo -->
    <legend>Dados profissionais</legend>

    <!-- Título da seção de natureza do cargo -->
    Natureza do Cargo
    <br>

    <!--
        Os botões de rádio permitem escolher apenas uma opção.
        O atributo "name" igual em todos faz com que pertençam ao mesmo grupo.
        "checked" deixa Gerência selecionada inicialmente.
    -->
    <input type="radio" name="cargo" checked> Gerência
    <input type="radio" name="cargo"> Financeiro
    <input type="radio" name="cargo"> Recepção
    <input type="radio" name="cargo"> Administrativo
    <input type="radio" name="cargo"> Jurídico
    <input type="radio" name="cargo"> Gerência

    <br><br>

    <!-- Título da seção de área de interesse -->
    Área de interesse
    <br>

    <!--
        As caixas de seleção permitem escolher uma ou várias opções.
    -->
    <input type="checkbox"> Computação
    <input type="checkbox"> Biologia
    <input type="checkbox"> Meio Ambiente
    <input type="checkbox"> Engenharia
    <input type="checkbox"> História

    <br><br>

    <!-- Campo para escrever o mini-currículo -->
    Mini-currículo:
    <br>

    <!--
        Área de texto.
        "rows" define a quantidade de linhas.
        "cols" define a quantidade aproximada de colunas.
    -->
    <textarea rows="5" cols="40"></textarea>

</fieldset>

<br>

<!--
    Botão Enviar:
    envia os dados preenchidos no formulário.
-->
<input type="submit" value="Enviar">

<!--
    Botão Limpar:
    apaga os dados preenchidos e restaura o formulário.
-->
<input type="reset" value="Limpar">

<!-- Fim do formulário -->
</form>

</body>
</html>
